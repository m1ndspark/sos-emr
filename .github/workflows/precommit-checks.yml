name: sos-emr mechanical checks

# Cloud backstop for the local pre-commit hook: re-runs the same content
# checks on every push and pull request, so nothing bad reaches GitHub even
# if a commit was made with --no-verify or from a clone without the hook
# enabled. Judgment checks (link names, collisions, triggers) are NOT run
# here - those stay with the sos-precommit-audit subagent.

on:
  push:
  pull_request:

jobs:
  mechanical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          # First push / new branch: before is all-zeros or unknown - fall back
          # to the repo root so we scan this push's own files rather than error.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 "$head" | tail -n1)
          fi
          git diff --name-only --diff-filter=ACM "$base" "$head" > changed.txt || true
          echo "Changed files:"; cat changed.txt || true

      - name: Run mechanical checks
        run: |
          if [ ! -s changed.txt ]; then
            echo "No changed files to scan."
            exit 0
          fi
          tr '\n' '\0' < changed.txt | xargs -0 --no-run-if-empty ./.githooks/sos-checks.sh

      - name: ds_map freshness (warn only)
        continue-on-error: true
        run: |
          idx=context/ds_map/_index.md
          if [ ! -f "$idx" ] || [ ! -f SOS_Referrals_App.ds ]; then
            echo "No ds_map index or .ds; skipping."
            exit 0
          fi
          want=$(sha256sum SOS_Referrals_App.ds | cut -d' ' -f1)
          have=$(grep -m1 -oE '\.ds SHA-256: [0-9a-f]{64}' "$idx" | grep -oE '[0-9a-f]{64}' || true)
          if [ "$want" != "$have" ]; then
            echo "::warning file=$idx::ds_map header SHA-256 (${have:-none}) does not match SOS_Referrals_App.ds ($want). Regenerate with: python3 tools/ds_sync.py --ds SOS_Referrals_App.ds --repo . --manifest --map"
          else
            echo "ds_map header SHA-256 matches SOS_Referrals_App.ds."
          fi
          if grep -q 'STATUS: STALE' "$idx"; then
            echo "::warning file=$idx::ds_map _index.md is marked STALE."
          fi
          exit 0
